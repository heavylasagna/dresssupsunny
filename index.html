<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dress Up Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <!-- LEFT SIDE -->
        <div id="left-menu">

            <!-- TOPS -->

            <img src="assets/футболка 1.png" class="clothing-item" id="shirt1">
            <img src="assets/футболка 2.png" class="clothing-item" id="shirt2">
            <img src="assets/футболка 3.png" class="clothing-item" id="shirt3">

            <img src="assets/футболка 4.png" class="clothing-item" id="shirt4">
            <img src="assets/футболка 5.png" class="clothing-item" id="shirt5">
            <img src="assets/футболка 6.png" class="clothing-item" id="shirt6">


            <!-- BOTTOMS -->

            <img src="assets/шорты 1.png" class="clothing-item" id="shorts1">
            <img src="assets/шорты 2.png" class="clothing-item" id="shorts2">
            <img src="assets/шорты 3.png" class="clothing-item" id="shorts3">

            <img src="assets/шорты 4.png" class="clothing-item" id="shorts4">
            <img src="assets/шорты 5.png" class="clothing-item" id="shorts5">
            <img src="assets/шорты 6.png" class="clothing-item" id="shorts6">

        </div>


        <!-- CHARACTER AREA -->
        <div id="character-area">

            <img src="assets/фигура.png" id="character">

        </div>


        <!-- RIGHT SIDE -->
        <div id="right-menu">

            <!-- SOCKS -->

            <img src="assets/носки 1.png" class="clothing-item" id="socks1">
            <img src="assets/носки 2.png" class="clothing-item" id="socks2">
            <img src="assets/носки 3.png" class="clothing-item" id="socks3">

            <img src="assets/носки 4.png" class="clothing-item" id="socks4">
            <img src="assets/носки 5.png" class="clothing-item" id="socks5">
            <img src="assets/носки 6.png" class="clothing-item" id="socks6">

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
