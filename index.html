<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dress Up Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <!-- LEFT CLOTHING AREA -->
        <div id="left-menu">

            <img
                src="assets/футболка 1.png"
                class="clothing-item"
                id="shirt1"
            >

            <img
                src="assets/футболка 2.png"
                class="clothing-item"
                id="shirt2"
            >

            <img
                src="assets/футболка 3.png"
                class="clothing-item"
                id="shirt3"
            >

            <img
                src="assets/футболка 4.png"
                class="clothing-item"
                id="shirt4"
            >

            <img
                src="assets/футболка 5.png"
                class="clothing-item"
                id="shirt5"
            >

            <img
                src="assets/футболка 6.png"
                class="clothing-item"
                id="shirt6"
            >

        </div>


        <!-- CHARACTER AREA -->
        <div id="character-area">

            <img
                src="assets/фигура.png"
                id="character"
            >

        </div>


        <!-- RIGHT CLOTHING AREA -->
        <div id="right-menu">
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
